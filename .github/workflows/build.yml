name: Build WynnLyrics Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if source was uploaded as archive
        run: |
          if [ ! -f "build.gradle" ] && ls *.zip 1> /dev/null 2>&1; then
            unzip -o '*.zip'
            rm -f *.zip
            if [ ! -f "build.gradle" ]; then
              SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -printf "%h\n" | head -n 1)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                shopt -s dotglob
                mv "$SUBDIR"/* .
                rm -rf "$SUBDIR"
              fi
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WynnLyrics-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
